<html>
    <head>
        <title>Minesweeper</title>
        <style>
            body{
                margin:0;
                background:#222;
                color:white;
                font-family:Arial;
                text-align:center;
            }

            #game{
                display:grid;
                margin:20px auto;
                width: max-content;
                grid-template-columns: repeat(9,30px);
            }

            .cell{
                width:30px;
                height:30px;
                background: #444;
                border:1px solid #555;
            }
        </style>
    </head>
    <body>
        <h1>Minesweeper</h1>
        <div id="game"></div>

    <script>
    let game=document.getElementById("game");
    let mines=[]

    while(mines.length<10){let n=Math.floor(Math.random()*81);if(!mines.includes(n))mines.push(n)}


    for(let i=0;i<81;i++){
        let cell=document.createElement("div");
        cell.className="cell";

        let x=i%9,y=Math.floor(i/9),n=0;
        for(let a=-1;a<2;a++)for(let b=-1;b<2;b++)if(mines.includes(i+a+b*9))n++;

        cell.onclick=function(){
            if(mines.includes(i))cell.textContent="*";else if(n)cell.textContent=n;
            cell.style.background="#777";
        };

        game.appendChild(cell);
    }
    </script>
    </body>
</html>
